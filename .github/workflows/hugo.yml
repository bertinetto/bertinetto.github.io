name: Build and publish Hugo site

on:
  push:
    branches:
      - dev-hugo
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-static-hugo
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.164.0"
          extended: true

      - name: Build
        run: hugo --minify

      - name: Publish to static-hugo
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: static-hugo
          cname: lucabertinetto.com
          force_orphan: true
