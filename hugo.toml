baseurl = "https://lucabertinetto.com"
title = "luca.bertinetto"
theme = "console"
languageCode = "en-gb"

[params]
# On mobile, hide the site name and keep only the sunflower
titleCutting = true

# Shell-style prompt after the site name (e.g. 🌻 luca.bertinetto:~$)
promptSuffix = ":~$"

# Blinking terminal cursor after the prompt
showCursor = false

# Set the animation style -- https://animate.style/
# To disable animations, please remove or comment animationStyle parameter
# animateStyle = "animated zoomIn fast"
animateStyle = ""
customCss = ["css/custom.css"]

# Font sizes in rem units (1rem = 16px by default)
baseFontSize = "0.95rem"         # Regular body text
headerFontSize = "1.05rem"       # Nav / logo chrome
pageTitleFontSize = "1.35rem"    # Page-level h1 (research, about, …)
sectionTitleFontSize = "1.05rem" # Subsection / paper titles
preambleFontSize = "1.08rem"     # Research page preamble
profileNameFontSize = "1.6rem"  # About / home name under banner
profileRoleFontSize = "1.15rem"  # Role line under the name

# Research page settings
showAuthors = true                # Whether to display authors in research items
websiteAuthor = "Luca Bertinetto" # Name to be underlined in author lists
authorsAfterTitleGap = "0.45em"   # Space between paper-title underline and author list

[[params.navlinks]]
name = "about/"
url = "about/"

[[params.navlinks]]
name = "research/"
url = "research/"

[params.linkstyle]
main = "#3a8ca4"  # Muted teal for links
hover = "#20607a" # Slightly deeper teal on hover
dotted = true     # Use dotted underline for content links
